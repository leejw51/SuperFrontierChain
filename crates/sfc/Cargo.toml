[package]
name = "sfc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SuperFroniterChain: a modular Rust L1 framework"

[dependencies]
anyhow = "1"
axum = "0.8"
capnp = "0.20"
capnp-rpc = "0.20"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
hex = "0.4"
bytes = "1"
http = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
k256 = { version = "0.13", features = ["ecdsa"] }
revm = { version = "19.5", default-features = false, features = ["std", "secp256k1", "portable", "serde", "optional_eip3607"] }
rlp = "0.5"
rayon = "1.12"
rocksdb = { version = "0.22", default-features = false, features = ["lz4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = "0.34.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
secp256k1 = { version = "0.29", features = ["recovery", "global-context"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }

[build-dependencies]
capnpc = "0.20"

[dev-dependencies]
libc = "0.2"
tempfile = "3"

[[bench]]
name = "execution"
harness = false
